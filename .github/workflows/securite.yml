name: Contrôle de sécurité

# Bloque toute publication contenant un secret (clé, mot de passe, jeton).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
