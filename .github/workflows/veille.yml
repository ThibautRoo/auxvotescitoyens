name: Veille hebdomadaire

# Contrôle chaque lundi à 6h (heure de Paris en hiver : 5h UTC) les sources des candidats.
# Ne modifie jamais les données : seuls veille/ (rapport + mémoire) est commité.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Veille
        run: python3 scripts/veille.py --issue-body "$RUNNER_TEMP/issue.md"

      - name: Commit du rapport
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add veille/
          if git diff --cached --quiet; then
            echo "Rien à commiter."
          else
            git commit -m "Veille du $(date +%d/%m/%Y) : rapport automatique (données inchangées)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Veille du $(date +%d/%m)" \
            --body-file "$RUNNER_TEMP/issue.md"
